# A tag like v1.0.0 runs the checks, then publishes a GitHub release with the three files SOUP's installer reads:
# manifest.json, main.js and styles.css. The tag must equal the manifest's version (SOUP refuses a mismatch).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          # The Google client (public by design, kept out of git: src/constants.ts). Repository secrets.
          DRIVE_SYNC_CLIENT_ID: ${{ secrets.DRIVE_SYNC_CLIENT_ID }}
          DRIVE_SYNC_CLIENT_SECRET: ${{ secrets.DRIVE_SYNC_CLIENT_SECRET }}
      - run: node scripts/verify-dist.mjs --release
      - name: The tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./dist/manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/manifest.json dist/main.js dist/styles.css \
            --title "Drive Sync $GITHUB_REF_NAME" --generate-notes
